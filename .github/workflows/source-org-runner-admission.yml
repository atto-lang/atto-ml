name: Source-org no-checkout runner admission canary
on:
  pull_request:
    paths:
      - ".github/workflows/source-org-runner-admission.yml"
  workflow_dispatch:
permissions: {}
jobs:
  source-org-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm actual runner execution without checkout
        shell: bash
        run: |
          set -euo pipefail
          printf 'SOURCE_ORG_RUNNER_STEP_EXECUTED=YES\n'
          printf 'HOST_OS=%s\n' "$(uname -s)"
