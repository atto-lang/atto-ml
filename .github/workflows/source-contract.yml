name: Source-only gate (NOT compiler execution)
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Host-only independent affine/SGD numerical oracle (NOT guest execution)
        run: node --test tests/affine_sgd_oracle.test.mjs
      - name: Verify unconfigured compiler rejects and smoke verifier self-tests
        shell: bash
        run: |
          set -eu
          test -s src/linear.ores
          test -s tests/smoke.ores
          sh -n scripts/test.sh
          sh -n scripts/test-smoke-verifier.sh
          set +e
          env -u ORESLANG_BIN sh scripts/test.sh
          status=$?
          set -e
          if [ "$status" -ne 78 ]; then
            echo "expected explicit NOT_EXECUTED exit 78; got $status" >&2
            exit 1
          fi
          sh scripts/test-smoke-verifier.sh
          echo "SOURCE_ONLY_OK; no real Oreslang compiler was run"
